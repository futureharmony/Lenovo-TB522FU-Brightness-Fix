plugins {
    id 'com.android.application'
}

android {
    namespace 'com.futureharmony.tb522fu.brightness'
    compileSdk 35

    defaultConfig {
        applicationId "com.futureharmony.tb522fu.brightness"
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
