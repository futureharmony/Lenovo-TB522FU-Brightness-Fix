name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version Info
        id: meta
        run: |
          VERSION=$(grep '^version=' magisk_module/module.prop | cut -d= -f2 | tr -d '\r\n ')
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: Build Magisk / KernelSU Module Zip
        run: |
          chmod +x build_zip.sh
          ./build_zip.sh

      - name: Generate Release Notes
        run: |
          cat << 'END_NOTES' > release_body.md
          ## 📱 联想拯救者 Y900 13英寸二代 (TB522FU) - 自动亮度优化模块

          本发布包由 GitHub Actions 自动化 CI/CD 构建并发布。

          ### 📦 包含构建产物
          * **`Lenovo-TB522FU-Brightness-Fix-${{ steps.meta.outputs.VERSION }}.zip`**
            - **适用环境**：KernelSU / APatch / Magisk 模块
            - **核心特性**：
              - **LCD 防暗盾 (系统级 HDR/Ultra HDR 智能屏蔽与 WebUI 热开关)**：彻底消除小红书大图、B站等全屏浏览时全局背光暴跌变暗发灰，WebUI 支持一键开/关并持久化记忆。
              - **屏幕硬件配置 ID 动态探测与自适应**：解除对特定 display_id 文件名的硬编码死绑，自动匹配设备真实硬件面板配置，跨屏幕批次及适配机型通用。
              - **开机自愈看门狗（Bootloop Watchdog & Auto-Fallback）**：异常启动 2 次自动熔断禁用，绝不卡 Logo。
              - **交互式 WebUI 控制台**：支持高频环境光、物理背光与滑块位置动态遥测及贝塞尔曲线拖拽调节。
              - **SELinux 安全沙盒规整**：彻底防止 WebView 崩溃。
            - **使用方法**：直接在 KernelSU / APatch / Magisk 管理器中选择“从本地安装”，重启后生效。

          ---
          * **适配设备**：联想拯救者 Y900 13英寸二代 (Lenovo TB522FU)
          * **适配系统**：ColorOS 16 (Android 16)
          * **构建提交**：`${{ steps.meta.outputs.SHORT_SHA }}`
          * **构建时间**：`${{ steps.meta.outputs.BUILD_TIME }}`
          END_NOTES

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.VERSION }}
          name: "Release ${{ steps.meta.outputs.VERSION }}"
          body_path: release_body.md
          draft: false
          prerelease: false
          files: |
            Lenovo-TB522FU-Brightness-Fix-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
