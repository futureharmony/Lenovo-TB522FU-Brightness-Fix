name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version Info
        id: meta
        run: |
          VERSION=$(grep '^version=' magisk_module/module.prop | cut -d= -f2 | tr -d '\r\n ')
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: Build Magisk / KernelSU Module Zip
        run: |
          chmod +x build_zip.sh
          ./build_zip.sh

      - name: Generate Release Notes
        run: |
          cat << 'END_NOTES' > release_body.md
          ## 📱 联想拯救者 Y900 13英寸二代 (TB522FU) - 自动亮度优化模块

          本发布包由 GitHub Actions 自动化 CI/CD 构建并发布。

          ### 🆕 v2.9.0 更新重点

          - **崩溃根因彻底修复（逆向实证）**：反编译 `oplus-services.jar` 定位到 `OplusDisplayBrightnessModeStrategy` 会依据 `brightness_table` 第 10/20 行 nit 差值选择亮度模型（`ExponentModel` 安全 / `LinearModel` 会在大亮度时 `displayBrightness > 1.0` 崩溃）。通过低端三次缓升平台锁定评分=1，稳定选中安全的 `ExponentModel`，从根本上杜绝 `PhotonicModulator` 崩溃与软重启循环。
          - **自动亮度 ↔ 实时试戴 完全一致**：`default.xml` 背光列改为线性 `nit/782×4095`（此前用感知曲线导致自动亮度明显达不到所设 nit）。实测同一 nit 下自动与试戴的物理背光一致。
          - **端点平台限制（UI 硬约束 + 说明）**：极暗底线锁定 `2~80N`（最暗保护，防极暗 PWM 闪烁/AOD 异常）；强光满格锁定 `400~782N`（782N 为常规 SDR 上限，超出进入 HBM 阳光模式）。拖拽/步进/保存三处限制统一，并新增说明面板。
          - **曲线严格单调防护**：编辑期即强制 `滑块↑ → nit↑`，杜绝「强光满格低于中间锚点」的倒挂与保存时的静默回推。
          - **首次试戴不生效修复**：解决 `settings put screen_brightness` 触发的框架异步 ramp 覆盖 sysfs 直写的时序竞态，首次点击即生效。
          - **用户曲线持久化备份**：新增独立备份目录，模块升级整体替换模块目录时自动兜底恢复，杜绝自定义曲线丢失。

          ### 📦 包含构建产物
          * **`Lenovo-TB522FU-Brightness-Fix-${{ steps.meta.outputs.VERSION }}.zip`**
            - **适用环境**：KernelSU / APatch / Magisk 模块
            - **核心特性**：
              - **设备原版为基重建 + 挂载前 Schema 嗅探**：安装时以当前设备自己的原版 XML 为底稿注入标定，开机挂载前双向校验结构标记与亮度表级别数（max/min），任一不符自动跳过该项挂载，从根源上消除跨批次/跨固件刷入卡 Logo 的问题。
              - **全链路诊断日志系统（默认开启）**：安装、开机挂载、看门狗与曲线对齐全过程落盘 logs/module.log；卡 Logo 时崩溃现场 (pstore) 同步转储，恢复开机后可在 WebUI 一键导出日志提交开发者定位根源。
              - **面板配置精确挂载**：仅挂载安装时嗅探记录的真实面板文件 (.panel_name)，不再全量覆盖设备上所有 display_id_*.xml；亮度表级别数随设备原版自适应。
              - **LCD 防暗盾（系统级 HDR/Ultra HDR 智能屏蔽与 WebUI 热开关）**：彻底消除小红书大图、B站等全屏浏览时全局背光暴跌变暗发灰，WebUI 支持一键开/关并持久化记忆。
              - **屏幕硬件配置 ID 动态探测与自适应**：解除对特定 display_id 文件名的硬编码死绑，自动匹配设备真实硬件面板配置，跨屏幕批次通用。
              - **开机自愈看门狗（Bootloop Watchdog & Auto-Fallback）**：异常启动 2 次自动熔断禁用，绝不无限卡 Logo。
              - **交互式 WebUI 控制台**：支持环境光、物理背光与滑块位置动态遥测、曲线拖拽调节、自定义曲线持久化与开机自愈对齐。
              - **SELinux 安全沙盒规整**：彻底防止 WebView 崩溃。
            - **使用方法**：直接在 KernelSU / APatch / Magisk 管理器中选择“从本地安装”，重启后生效。
            - **卡 Logo 自救**：强制重启 2~3 次待看门狗自动熔断放行开机，然后在 WebUI「诊断日志系统」导出日志反馈。

          ---
          * **适配设备**：联想拯救者 Y900 13英寸二代 (Lenovo TB522FU)
          * **适配系统**：ColorOS 16 (Android 16)
          * **构建提交**：`${{ steps.meta.outputs.SHORT_SHA }}`
          * **构建时间**：`${{ steps.meta.outputs.BUILD_TIME }}`
          END_NOTES

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.VERSION }}
          name: "Release ${{ steps.meta.outputs.VERSION }}"
          body_path: release_body.md
          draft: false
          prerelease: false
          files: |
            Lenovo-TB522FU-Brightness-Fix-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
